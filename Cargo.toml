[package]
name = "nzkide-module"
description = "The VSCode-like source IDE pane for cs viewer v3 (egui, no browser engine)"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/naruzkurai/nzkide_module"

# A separable addon. The host takes it as a pinned git dependency and supplies
# its graph through `idelink_nzkide::Language`; this crate has no host types,
# no `Graph`, no `CodeLensView` and no chrome.
[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
csgraph-core = { git = "https://github.com/NaruZkurai/nzk-cs-viewer.git", rev = "c90bfca0218ab9a6d3536cea040fe34c6d2a6d30" }
serde_json = "1"
def2mcpfnnumber = { git = "https://github.com/NaruZkurai/nzk-cs-def2mcpfnnumber_rs_ide_addon.git", rev = "a063dfc8ffd6306b7a15dcd8959241df4ae684ac" }
